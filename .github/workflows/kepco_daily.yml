name: 한전 전력사용량 자동 수집

on:
  schedule:
    - cron: "7 21 * * *"   # 매일 오전 6:07 (한국시간)
  workflow_dispatch:        # Actions 화면의 Run workflow 버튼으로 수동 실행
    inputs:
      date:
        description: "특정 날짜만 수집 (예: 2026-10-30). 비우면 최근 3일"
        required: false
        default: ""
      dry_run:
        description: "시험만 (시트에 쓰지 않음)"
        type: boolean
        default: false

permissions:
  contents: write   # 아래 '자동 실행 유지' 단계에서 빈 기록을 남기기 위해 필요

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install gspread google-auth requests
      - name: 수집 실행
        env:
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          KEPCO_SITES: ${{ secrets.KEPCO_SITES }}
          KEPCO_API_KEY: ${{ secrets.KEPCO_API_KEY }}
          KEPCO_METER_DAYS: ${{ secrets.KEPCO_METER_DAYS }}
          KEPCO_MOCK: ${{ vars.KEPCO_MOCK }}
          KEPCO_START: ${{ vars.KEPCO_START }}
          MONTHLY_FROM: ${{ vars.MONTHLY_FROM }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.date }}" ]; then ARGS="$ARGS --date ${{ github.event.inputs.date }}"; fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python kepco_sync.py $ARGS

      # GitHub는 저장소에 60일간 변경이 없으면 예약 실행을 꺼버린다.
      # 마지막 기록이 45일 넘게 지났으면 빈 기록(keepalive)을 하나 남겨 자동 실행을 유지한다.
      - name: 자동 실행 유지
        if: github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct)
          days=$(( ($(date +%s) - last) / 86400 ))
          echo "마지막 기록 후 ${days}일"
          if [ "$days" -ge 45 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "keepalive: 자동 수집 유지"
            git push
          fi
