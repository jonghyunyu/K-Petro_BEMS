name: Keep K-REMS App Awake

# Streamlit 무료 앱은 약 12시간 동안 접속이 없으면 잠듭니다.
# GitHub 예약 실행은 몇 시간씩 늦게 시작될 수 있으므로 4시간마다 실제 브라우저로 접속해 깨워 둡니다.
on:
  schedule:
    - cron: "17 */4 * * *"   # 4시간마다 (한국시간 01:17, 05:17, 09:17, 13:17, 17:17, 21:17 예정)
  workflow_dispatch:

jobs:
  wake-up:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright
        run: |
          npm init -y > /dev/null
          npm install playwright > /dev/null
          npx playwright install chromium --with-deps > /dev/null

      - name: Visit and wake up app
        run: |
          node -e '
          const { chromium } = require("playwright");
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();
            await page.goto("https://kpetro-bems.streamlit.app", { waitUntil: "domcontentloaded", timeout: 90000 });
            await page.waitForTimeout(8000);

            // 잠든 상태면 깨우기 버튼 클릭 (버튼이 iframe 안에 있을 수도 있어 모든 frame 확인)
            let woke = false;
            for (const f of page.frames()) {
              const btn = f.locator("button:has-text(\"get this app back up\")");
              if (await btn.count() > 0) { await btn.first().click(); woke = true; break; }
            }
            console.log(woke ? "잠든 앱을 깨우는 중..." : "앱이 깨어 있음");

            // 앱 화면이 실제로 뜰 때까지 최대 3분 대기 (접속이 이어져야 활동으로 기록됨)
            const deadline = Date.now() + 180000;
            let ok = false;
            while (Date.now() < deadline) {
              for (const f of page.frames()) {
                if (await f.locator("text=K-REMS").count() > 0) { ok = true; break; }
              }
              if (ok) break;
              await page.waitForTimeout(5000);
            }
            await page.waitForTimeout(20000);
            await browser.close();
            if (!ok) { console.log("앱 화면 확인 실패"); process.exit(1); }
            console.log("앱 접속 확인 완료");
          })();
          '
